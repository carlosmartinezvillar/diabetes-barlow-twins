apiVersion: batch/v1
kind: Job
metadata:
  name: hpo-0-000
spec:

  backoffLimit: 1

  template:
    spec:

      tolerations:
        - key: nautilus.io/reservation
          operator: Equal
          value: mizzou
          effect: NoSchedule

      containers:
      - name: s2health-trainer
        image: docker.io/cimartinezvillar/dcnn-pytorch:cuda12.4base-ubuntu22.04
        imagePullPolicy: Always

        resources:
          limits:
            memory: 128Gi
            cpu: 8
            ephemeral-storage: 60Gi
            nvidia.com/a100: 1
          requests:
            memory: 128Gi
            cpu: 8
            ephemeral-storage: 60Gi
            nvidia.com/a100: 1

        env:
          - name: RUN_NAME
            value: "hpo_0"
          - name: MODEL_ID
            value: "000"
          - name: WORKERS
            value: "8"

        command: ["/bin/sh","-c"]
        args:
          - |
            git clone https://github.com/carlosmartinezvillar/diabetes-barlow-twins && cd diabetes-barlow-twins && exec bash ./k8s/train.sh

        volumeMounts:
        - mountPath: /chips_pvc
          name: chips-vol
        - mountPath: /cache
          name: cache-vol
        - mountPath: /model_pvc
          name: model-vol
        - mountPath: /log_pvc
          name: log-vol
        - mountPath: /dev/shm
          name: dshm

      volumes:
      - name: model-vol
        persistentVolumeClaim:
          claimName: diabetes-models
      - name: log-vol
        persistentVolumeClaim:
          claimName: diabetes-logs
      - name: chips-vol
        persistentVolumeClaim:
          claimName: diabetes-chips                 
      - name: cache-vol
        emptyDir:
          sizeLimit: 60Gi
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 16Gi # 16G maxed out at batch 128 when transforms are in CPU! 


      restartPolicy: Never

      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                # - NVIDIA-GeForce-RTX-3090 
                # - NVIDIA-RTX-A6000
                # - NVIDIA-A100-PCIE-40GB
                - NVIDIA-A100-SXM4-80GB